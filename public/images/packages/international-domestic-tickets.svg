<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="50%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#051329" />
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#1e4976" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a192f" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD116" />
      <stop offset="100%" stop-color="#E5A800" />
    </linearGradient>

    <!-- Green Feather Gradient -->
    <linearGradient id="greenFeather" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#006b38" />
      <stop offset="100%" stop-color="#009e49" />
    </linearGradient>

    <!-- Yellow Feather Gradient -->
    <linearGradient id="yellowFeather" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5a800" />
      <stop offset="100%" stop-color="#fed100" />
    </linearGradient>

    <!-- Red Feather Gradient -->
    <linearGradient id="redFeather" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ba0c2f" />
      <stop offset="100%" stop-color="#e4002b" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#fcd116" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <rect width="800" height="600" fill="url(#glow)" />

  <!-- Elegant Flight Trajectory Lines in background -->
  <g opacity="0.15" stroke="#60a5fa" stroke-width="1.5" fill="none">
    <path d="M-50,450 Q 200,100 500,250 T 850,150" stroke-dasharray="6,8" />
    <path d="M-100,250 Q 350,500 700,200 T 900,400" stroke-dasharray="4,6" />
    <path d="M100,550 Q 400,200 800,350" />
    <!-- Lat/Long arcs -->
    <ellipse cx="400" cy="270" rx="340" ry="200" stroke-dasharray="2,8" opacity="0.6"/>
    <ellipse cx="400" cy="270" rx="260" ry="140" stroke-dasharray="2,8" opacity="0.4"/>
  </g>

  <!-- Central Emblem Container -->
  <g transform="translate(400, 230)" filter="url(#shadow)">
    <!-- Outer Glow Ring -->
    <circle r="128" fill="none" stroke="#fcd116" stroke-width="2" opacity="0.3" filter="url(#subtleGlow)" />
    <circle r="138" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="4,6" opacity="0.25" />

    <!-- Pure White Circular Disc (The exact Ethiopian Airlines roundel) -->
    <circle r="120" fill="#ffffff" />

    <!-- The 3 Iconic Wing Feathers -->
    <g transform="translate(0, 0)">
      <!-- Green Feather (Top / Longest) -->
      <path d="M -80,48 C -60,20 10,-40 76,-72 C 78,-73 80,-70 78,-66 C 55,-22 -10,38 -76,54 C -79,54 -81,51 -80,48 Z" fill="url(#greenFeather)" />
      
      <!-- Yellow Feather (Middle) -->
      <path d="M -75,56 C -40,38 18,-6 68,-2 C 71,-1 71,3 67,6 C 25,26 -28,52 -69,63 C -73,64 -76,60 -75,56 Z" fill="url(#yellowFeather)" />
      
      <!-- Red Feather (Bottom) -->
      <path d="M -70,64 C -35,58 10,38 48,46 C 52,47 52,51 47,53 C 12,68 -32,71 -64,70 C -68,70 -71,67 -70,64 Z" fill="url(#redFeather)" />
    </g>
  </g>

  <!-- Badges & Text Overlay -->
  <!-- Top Badge: Official Flight Ticketing -->
  <g transform="translate(400, 48)">
    <rect x="-165" y="0" width="330" height="34" rx="17" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25" />
    <text x="0" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fcd116" text-anchor="middle" letter-spacing="2">
      ✈ ETHIOPIAN AIRLINES &amp; GLOBAL
    </text>
  </g>

  <!-- Lower Title & Details -->
  <!-- Main Title -->
  <text x="400" y="420" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
    International &amp; Domestic Flights
  </text>

  <!-- Subtitle -->
  <text x="400" y="456" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#cbd5e1" text-anchor="middle">
    All Domestic Ethiopian Routes · Middle East · Worldwide Destinations
  </text>

  <!-- Bottom Pills: Fast Confirmation / 24/7 Date Changes -->
  <g transform="translate(400, 505)">
    <!-- Pill 1: Domestic Routes -->
    <g transform="translate(-190, 0)">
      <rect x="0" y="0" width="175" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.2"/>
      <text x="87" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">
        ✓ Ethiopian Routes
      </text>
    </g>
    <!-- Pill 2: Worldwide Tickets -->
    <g transform="translate(15, 0)">
      <rect x="0" y="0" width="175" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2"/>
      <text x="87" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">
        ✓ Worldwide Tickets
      </text>
    </g>
  </g>

  <!-- Golden bottom accent line -->
  <rect x="250" y="570" width="300" height="2" fill="url(#goldGrad)" opacity="0.6" rx="1" />
</svg>