<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 140" fill="none">
  <!-- Emblem Group -->
  <g transform="translate(10, 10)">
    <!-- Royal Blue Tilted Pill -->
    <rect x="35" y="6" width="18" height="108" rx="9" transform="rotate(24 44 60)" fill="#0842CD"/>
    
    <!-- Outer Chevron Backing (White Border) -->
    <path d="M 14 56 L 44 98 L 86 32 L 81 29 L 90 22 L 91 33 L 88 31 L 44 102 L 10 58 Z" fill="#FFFFFF"/>
    <!-- Outer Chevron Red Body with Jet Nose -->
    <path d="M 15 58 L 44 97 L 79 38 L 74 35 L 77 33 L 89 24 L 88 36 L 85 34 L 82 39 L 44 100 L 12 60 Z" fill="#E11D48"/>
    
    <!-- Inner Chevron -->
    <path d="M 18 45 L 44 79 L 71 39 L 75 42 L 44 85 L 14 47 Z" fill="#E11D48" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- Typography: HIKAYA -->
  <text x="130" y="72" font-family="var(--font-inter), system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="56" letter-spacing="0.06em" fill="#E11D48">HIKAYA</text>
  
  <!-- Typography: Travel Agency -->
  <text x="138" y="110" font-family="var(--font-inter), system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="26" letter-spacing="0.04em" fill="#0842CD">Travel Agency</text>
</svg>